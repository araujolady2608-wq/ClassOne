version: '3.8'

services:
  # 1. Base de datos PostgreSQL
  db:
    image: postgres:15-alpine
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: mi_base_datos
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: Admin123
    ports:
      - "5432:5432"
    networks:
      - red-proyecto

  # 2. Backend Django
  backend:
    build: ./backend
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    environment:
      - DB_NAME=mi_base_datos
      - DB_USER=postgres
      - DB_PASSWORD=Admin123
      - DB_HOST=db
      - DB_PORT=5432
    depends_on:
      - db
    networks:
      - red-proyecto

volumes:
  postgres_data:

networks:
  red-proyecto:
    driver: bridge