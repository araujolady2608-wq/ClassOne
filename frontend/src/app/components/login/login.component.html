<div class="container d-flex flex-column justify-content-center align-items-center vh-100 bg-light">
  
  <!-- Tarjeta Blanca Principal -->
  <div class="card shadow p-4 border-0 rounded-4" style="width: 100%; max-width: 420px;">
    
    <div class="text-center mb-4">
      <h3 class="fw-bold text-primary">Iniciar Sesión</h3>
      <p class="text-muted">Sistema de Gestión Académica</p>
    </div>

    <!-- Alerta de error -->
    <div *ngIf="errorMessage" class="alert alert-danger alert-dismissible fade show" role="alert">
      {{ errorMessage }}
      <button type="button" class="btn-close" (click)="errorMessage = ''"></button>
    </div>

    <!-- Formulario de Login -->
    <form (submit)="onLogin(); $event.preventDefault()">
      
      <!-- Usuario / Correo -->
      <div class="mb-3">
        <label class="form-label text-muted">Nombre de usuario o dirección de correo</label>
        <input 
          type="text" 
          class="form-control" 
          [(ngModel)]="username" 
          name="username" 
          placeholder="Ingresa tu usuario" 
          required>
      </div>

      <!-- Contraseña con botón de Ver/Ocultar -->
      <div class="mb-3">
        <label class="form-label text-muted">Contraseña</label>
        <div class="input-group">
          <input 
            [type]="showPassword ? 'text' : 'password'" 
            class="form-control" 
            [(ngModel)]="password" 
            name="password" 
            placeholder="••••••••" 
            required>
          <button class="btn btn-outline-secondary d-flex align-items-center bg-white" type="button" (click)="togglePassword()" style="border-color: #dee2e6;" title="Mostrar/Ocultar contraseña">
            <!-- Usamos emojis para el ojo para no depender de librerías, pero puedes cambiarlo por un icono de Bootstrap si quieres -->
            <span *ngIf="!showPassword">👀</span>
            <span *ngIf="showPassword">🫣</span>
          </button>
        </div>
      </div>

      <!-- Recuérdame y Botón Acceder -->
      <div class="d-flex justify-content-between align-items-center mt-4 mb-2">
        <div class="form-check">
          <input class="form-check-input" type="checkbox" id="rememberMe" [(ngModel)]="rememberMe" name="rememberMe">
          <label class="form-check-label text-muted" for="rememberMe" style="cursor: pointer;">
            Recuérdame
          </label>
        </div>
        
        <button type="submit" class="btn btn-primary px-4 py-2 fw-bold shadow-sm rounded-3">
          Acceder
        </button>
      </div>

    </form>
  </div>

  <!-- Enlaces de Ayuda y Regreso al Inicio -->
  <div class="mt-4" style="width: 100%; max-width: 420px;">
    <!-- Enlace: Olvidaste la contraseña -->
    <a routerLink="/recuperar-password" class="text-decoration-none d-block mb-3" style="color: #4a5568;">
      ¿Olvidaste tu contraseña?
    </a>
    
    <!-- Enlace: Volver a la página principal (Landing Page) -->
    <!-- routerLink="/" lo lleva a tu LandingComponent -->
    <a routerLink="/" class="text-decoration-none d-block" style="color: #4a5568;">
      &larr; Regresar a la página Principal
    </a>
  </div>

</div>
