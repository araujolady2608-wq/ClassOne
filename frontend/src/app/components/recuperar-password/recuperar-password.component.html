<div class="container d-flex flex-column justify-content-center align-items-center vh-100 bg-light">
  
  <div class="card shadow p-4 border-0 rounded-4" style="width: 100%; max-width: 420px;">
    
    <div class="text-center mb-4">
      <div class="bg-primary text-white rounded-circle d-inline-flex justify-content-center align-items-center mb-3 shadow-sm" style="width: 60px; height: 60px; font-size: 24px;">
        🔒
      </div>
      <h4 class="fw-bold text-primary">Recuperar Contraseña</h4>
      <p class="text-muted small mt-2">
        Ingresa el correo electrónico asociado a tu cuenta institucional. Si está registrado en nuestro sistema, te enviaremos un enlace seguro para restablecer tu acceso.
      </p>
    </div>

    <!-- Alertas de Éxito o Error -->
    <div *ngIf="mensajeError" class="alert alert-danger py-2 text-center" role="alert">
      {{ mensajeError }}
    </div>
    <div *ngIf="mensajeExito" class="alert alert-success py-2 text-center" role="alert">
      {{ mensajeExito }}
    </div>

    <!-- Formulario -->
    <form (submit)="enviarEnlace(); $event.preventDefault()">
      <div class="mb-4">
        <label class="form-label text-muted fw-semibold">Correo electrónico institucional</label>
        <input 
          type="email" 
          class="form-control" 
          [(ngModel)]="email"
          name="email"
          placeholder="usuario@iemep.edu.co" 
          required>
      </div>

      <button type="submit" class="btn btn-primary w-100 py-2 fw-bold shadow-sm rounded-3 mb-2">
        Enviar enlace de recuperación
      </button>
    </form>
    
  </div>

  <div class="mt-4 text-center" style="width: 100%; max-width: 420px;">
    <a routerLink="/login" class="text-decoration-none d-block" style="color: #4a5568; transition: 0.2s;">
      &larr; Volver al inicio de sesión
    </a>
  </div>

</div>
